<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content & Sales Engine</title><style>body{font-family:system-ui,sans-serif;max-width:1180px;margin:30px auto;padding:0 16px;background:#f6f7f9;color:#171717}h1{margin-bottom:4px}.sub{color:#666}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}select,button{padding:9px 12px;border:1px solid #bbb;border-radius:8px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:15px}.pill{font-size:12px;background:#eee;border-radius:99px;padding:4px 8px;display:inline-block;margin:2px}.muted{color:#666;font-size:13px}.idea{font-weight:700;margin:10px 0}.status{margin-top:8px}</style></head><body><h1>Content & Sales Engine</h1><p class="sub">Centrale marketingbasis voor DailyCashPlan, PantryPlan, AI Stamp Scanner en AI Coin Scanner.</p><div class="bar"><select id="product"><option value="all">Alle producten</option><option value="dcp">DailyCashPlan</option><option value="pp">PantryPlan</option><option value="stamp">AI Stamp Scanner</option><option value="coin">AI Coin Scanner</option></select><select id="lang"><option value="all">EN + NL</option><option value="en">EN</option><option value="nl">NL</option></select><select id="channel"><option value="all">Alle formats</option><option>threads</option><option>linkedin-short</option><option>linkedin-mini-blog</option><option>seo-article</option><option>sales-listing</option></select><button onclick="render()">Filter</button></div><div id="stats"></div><div class="grid" id="grid"></div><script>
const PRODUCTS={dcp:{name:'DailyCashPlan',repo:'Vid567/dailycashplan',url:'https://bit.ly/dailycashplan'},pp:{name:'PantryPlan',repo:'Vid567/pantryplan',url:'https://bit.ly/pantryplan'},stamp:{name:'AI Stamp Collection Scanner',repo:'Vid567/ai-stamp-collection-scanner',url:'https://bit.ly/AIStampScannerApp'},coin:{name:'AI Coin Collection Scanner',repo:'Vid567/ai-coin-collection-scanner',url:'https://bit.ly/AICoinScannerApp'}};
const FORMATS=['threads','linkedin-short','linkedin-mini-blog','seo-article','sales-listing'];
const ideas=[
{id:'DCP-M001',p:'dcp',en:'Where did my money go?',nl:'Waar bleef mijn geld?',angle:'clarity-before-complex-budgeting'},
{id:'DCP-M002',p:'dcp',en:'Debt is a number, not a judgment',nl:'Schuld is een getal, geen oordeel',angle:'shame-free-debt-clarity'},
{id:'PP-M001',p:'pp',en:'Why we buy groceries we already have',nl:'Waarom we boodschappen kopen die we al hebben',angle:'duplicate-purchases'},
{id:'PP-M002',p:'pp',en:'A shopping list is not enough',nl:'Waarom alleen een boodschappenlijst niet genoeg is',angle:'inventory-before-shopping'},
{id:'STAMP-M001',p:'stamp',en:'Inherited a stamp collection: what first?',nl:'Een postzegelverzameling geërfd: wat eerst?',angle:'inventory-before-valuation'},
{id:'STAMP-M002',p:'stamp',en:'Why AI should not pretend every stamp is identified',nl:'Waarom AI niet moet doen alsof iedere postzegel is geïdentificeerd',angle:'responsible-ai-identification'},
{id:'COIN-M001',p:'coin',en:'Inventory coins before researching value',nl:'Inventariseer munten vóór je waarde onderzoekt',angle:'inventory-before-value'},
{id:'COIN-M002',p:'coin',en:'Keep coin positions fixed between front and back photos',nl:'Houd muntposities gelijk tussen voor- en achterzijdefoto',angle:'photo-pairing'}];
function key(i,l,f){return `cse:${i}:${l}:${f}`};function status(i,l,f){return localStorage.getItem(key(i,l,f))||((l==='nl')?'ai-translated':'master')};function cycle(i,l,f){let s=status(i,l,f);s=s==='ai-translated'?'human-reviewed':s==='human-reviewed'?'ready':s==='master'?'ready':s==='ready'?'scheduled':s==='scheduled'?'published':l==='nl'?'ai-translated':'master';localStorage.setItem(key(i,l,f),s);render()}
function render(){const p=document.getElementById('product').value,l=document.getElementById('lang').value,c=document.getElementById('channel').value,g=document.getElementById('grid');g.innerHTML='';let n=0;ideas.forEach(x=>['en','nl'].forEach(lang=>FORMATS.forEach(f=>{if((p!=='all'&&x.p!==p)||(l!=='all'&&lang!==l)||(c!=='all'&&f!==c))return;n++;let el=document.createElement('div');el.className='card';el.innerHTML=`<span class="pill">${PRODUCTS[x.p].name}</span><span class="pill">${lang.toUpperCase()}</span><span class="pill">${f}</span><div class="idea">${lang==='nl'?x.nl:x.en}</div><div class="muted">Master ID: ${x.id}<br>Angle: ${x.angle}<br>Bron: ${PRODUCTS[x.p].repo}</div><div class="status"><button onclick="cycle('${x.id}','${lang}','${f}')">${status(x.id,lang,f)}</button></div>`;g.appendChild(el)})));document.getElementById('stats').innerHTML=`<p><b>${n}</b> contenttaken zichtbaar · statusflow: master/ai-translated → human-reviewed → ready → scheduled → published</p>`}render();
</script></body></html>
