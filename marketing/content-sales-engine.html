<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content & Sales Engine</title><style>body{font-family:system-ui,sans-serif;max-width:1180px;margin:30px auto;padding:0 16px;background:#f6f7f9;color:#171717}h1{margin-bottom:4px}.sub,.muted{color:#666}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}select,button{padding:9px 12px;border:1px solid #bbb;border-radius:8px;background:white}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.stat{background:white;border:1px solid #ddd;border-radius:10px;padding:10px 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:15px}.pill{font-size:12px;background:#eee;border-radius:99px;padding:4px 8px;display:inline-block;margin:2px}.text{white-space:pre-wrap;margin:12px 0;font-size:14px}.count{font-size:12px}.ok{color:#087a2f}.warn{color:#a25b00}</style></head><body><h1>Content & Sales Engine</h1><p class="sub">Bestaande centrale contentbibliotheek. Eerst EN + NL Threads; nieuwe kanalen worden hier later vanuit opgebouwd.</p><div class="bar"><select id="product"><option value="all">Alle producten</option><option value="dcp">DailyCashPlan</option><option value="pp">PantryPlan</option><option value="stamp">AI Stamp Scanner</option><option value="coin">AI Coin Scanner</option></select><select id="lang"><option value="all">EN + NL</option><option value="en">EN</option><option value="nl">NL</option></select><select id="review"><option value="all">Alle reviewstatussen</option><option value="master">master</option><option value="ai-translated">ai-translated</option><option value="human-reviewed">human-reviewed</option></select><button onclick="render()">Filter</button></div><div class="stats" id="stats"></div><div class="grid" id="grid"></div><script>
let db={posts:[]};const localKey=id=>`cse-review:${id}`;function reviewStatus(p){return localStorage.getItem(localKey(p.id))||p.review_status}function approve(p){localStorage.setItem(localKey(p.id),'human-reviewed');render()}function displayText(p){const s=reviewStatus(p);return (p.language==='nl'&&s==='human-reviewed')?p.text.replace(/\n\n🤖 Vertaald met AI[^\n]*/,''):p.text}function copy(p){navigator.clipboard.writeText(displayText(p))}
async function init(){try{const r=await fetch('./content-database.json',{cache:'no-store'});db=await r.json();render()}catch(e){document.getElementById('grid').innerHTML='<p>Database kon niet worden geladen. Draai eerst de marketing build-workflow.</p>'}}
function render(){const pf=product.value,lf=lang.value,rf=review.value;const all=db.posts||[];const rows=all.filter(p=>(pf==='all'||p.product_key===pf)&&(lf==='all'||p.language===lf)&&(rf==='all'||reviewStatus(p)===rf));const en=all.filter(p=>p.language==='en').length,nl=all.filter(p=>p.language==='nl').length,reviewed=all.filter(p=>reviewStatus(p)==='human-reviewed').length;stats.innerHTML=`<div class="stat"><b>${all.length}</b><br><span class="muted">totaal bestaand</span></div><div class="stat"><b>${en}</b><br><span class="muted">EN</span></div><div class="stat"><b>${nl}</b><br><span class="muted">NL</span></div><div class="stat"><b>${reviewed}</b><br><span class="muted">menselijk gecontroleerd</span></div><div class="stat"><b>${rows.length}</b><br><span class="muted">zichtbaar</span></div>`;grid.innerHTML='';rows.forEach(p=>{const s=reviewStatus(p),el=document.createElement('article');el.className='card';el.innerHTML=`<span class="pill">${p.product}</span><span class="pill">${p.language.toUpperCase()}</span><span class="pill">Threads</span><span class="pill">${s}</span><div class="muted">${p.id} · ${p.theme}</div><div class="text"></div><div class="count ${p.character_count<=500?'ok':'warn'}">${displayText(p).length}/500 tekens</div><div class="bar"><button class="copy">Kopiëren</button>${p.language==='nl'&&s!=='human-reviewed'?'<button class="approve">✓ Taal gecontroleerd</button>':''}</div>`;el.querySelector('.text').textContent=displayText(p);el.querySelector('.copy').onclick=()=>copy(p);const a=el.querySelector('.approve');if(a)a.onclick=()=>approve(p);grid.appendChild(el)})}init();
</script></body></html>
