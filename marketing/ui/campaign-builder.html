<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Campaign Builder</title><style>body{font-family:Arial,sans-serif;margin:40px}label{display:block;margin-top:12px}select,button{padding:8px;margin-top:5px}button{cursor:pointer}.result{margin-top:20px}</style></head><body>
<h1>Marketing Campaign Builder</h1>
<label>Product</label><select id="product"><option value="dcp">DailyCashPlan</option><option value="pp">PantryPlan</option><option value="stamp">AI Stamp Collection Scanner</option><option value="coin">AI Coin Collection Scanner</option></select>
<label>Language</label><select id="language"><option value="en">English</option></select>
<label>Batch size</label><select id="batch"><option value="10">10 posts</option><option value="20">20 posts</option><option value="50">50 posts</option></select>
<button id="generate">Generate Buffer CSV</button><div class="result" id="status">Ready</div>
<script src="campaign-bootstrap.js"></script><script src="campaign-builder-integration.js"></script><script>
const esc=v=>`"${String(v??'').replaceAll('"','""')}"`;
function csv(batch,c){const h=['Post ID','Product','Language','Campaign','Text','Posting Time','Status','UTM URL'];const rows=batch.map(x=>[x.id,c.product,c.language,c.id,x.text,x.postingTime||'','ready',x.trackingUrl]);return[h,...rows].map(r=>r.map(esc).join(',')).join('\r\n')}
function validate(out,batch,requested){const h=out.split(/\r?\n/)[0],req=['Post ID','Product','Language','Campaign','Text','Posting Time','Status','UTM URL'],missing=req.filter(x=>!h.includes(x)),badTracking=batch.filter(x=>!x.trackingUrl||!x.trackingUrl.includes('utm_source=threads')||!x.trackingUrl.includes('utm_campaign=')||!x.trackingUrl.includes('utm_content='));return{passed:missing.length===0&&batch.length===requested&&badTracking.length===0,missing,badTracking}}
function download(out,name){const b=new Blob([out],{type:'text/csv;charset=utf-8;'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),0)}
async function run(){const product=document.getElementById('product').value,language=document.getElementById('language').value,batchSize=Number(document.getElementById('batch').value),status=document.getElementById('status');try{status.textContent='Loading production content and validating…';const posts=await CampaignBootstrap.prepareCampaignData(product,language);if(posts.length<batchSize)throw new Error(`Only ${posts.length} production posts available; ${batchSize} requested.`);const campaign=await CampaignBuilderIntegration.generateCampaignExport({product,language,batchSize,posts});const out=csv(campaign.batch,campaign),v=validate(out,campaign.batch,batchSize);if(!v.passed)throw new Error(`Validation failed${v.missing.length?': missing '+v.missing.join(', '):''}${v.badTracking.length?`: ${v.badTracking.length} invalid tracking URLs`:''}.`);download(out,`${campaign.id}-${campaign.count}-posts.csv`);status.textContent=`✓ Production export validated and downloaded: ${campaign.id} (${campaign.count}/${batchSize} posts)`}catch(e){status.textContent=`✗ ${e.message}`}}
document.getElementById('generate').addEventListener('click',run);
</script></body></html>
