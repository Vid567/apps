<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campaign Builder</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; }
label { display:block; margin-top:12px; }
select, button { padding:8px; margin-top:5px; }
button { cursor:pointer; }
.result { margin-top:20px; }
</style>
</head>
<body>
<h1>Marketing Campaign Builder</h1>

<label>Product</label>
<select id="product">
<option value="dcp">DailyCashPlan</option>
<option value="pp">PantryPlan</option>
<option value="stamp">AI Stamp Collection Scanner</option>
<option value="coin">AI Coin Collection Scanner</option>
</select>

<label>Language</label>
<select id="language">
<option value="en">English</option>
</select>

<label>Batch size</label>
<select id="batch">
<option value="10">10 posts</option>
<option value="20">20 posts</option>
<option value="50">50 posts</option>
</select>

<button id="generate">Generate Buffer CSV</button>

<div class="result" id="status">Ready</div>

<script>
// Integration point for the safe export controller.
// The campaign engine can inject the actual modules here.

function campaignRequest() {
  return {
    product: document.getElementById('product').value,
    language: document.getElementById('language').value,
    batchSize: Number(document.getElementById('batch').value)
  };
}

document.getElementById('generate').addEventListener('click', () => {
  const request = campaignRequest();

  document.getElementById('status').textContent =
    `Campaign ready for validation: ${request.product}_${request.language}_beta (${request.batchSize} posts)`;
});
</script>
</body>
</html>
