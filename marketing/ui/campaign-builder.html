<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campaign Builder</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; }
label { display:block; margin-top:12px; }
select, button { padding:8px; margin-top:5px; }
button { cursor:pointer; }
.result { margin-top:20px; }
</style>
</head>
<body>
<h1>Marketing Campaign Builder</h1>

<label>Product</label>
<select id="product">
<option value="dcp">DailyCashPlan</option>
<option value="pp">PantryPlan</option>
<option value="stamp">AI Stamp Collection Scanner</option>
<option value="coin">AI Coin Collection Scanner</option>
</select>

<label>Language</label>
<select id="language">
<option value="en">English</option>
</select>

<label>Batch size</label>
<select id="batch">
<option value="10">10 posts</option>
<option value="20">20 posts</option>
<option value="50">50 posts</option>
</select>

<button id="generate">Generate Buffer CSV</button>
<div class="result" id="status">Ready</div>

<script src="campaign-bootstrap.js"></script>
<script src="campaign-builder-integration.js"></script>
<script>
function campaignRequest() {
  return {
    product: document.getElementById('product').value,
    language: document.getElementById('language').value,
    batchSize: Number(document.getElementById('batch').value)
  };
}

async function runCampaignBuilder() {
  const request = campaignRequest();
  const posts = await window.CampaignBootstrap.prepareCampaignData(
    request.product,
    request.language
  );

  const result = await window.CampaignBuilderIntegration.generateCampaignExport({
    ...request,
    posts
  });

  document.getElementById('status').textContent =
    `Campaign prepared: ${result.product}_${result.language}_beta (${posts.length} posts loaded)`;
}

document.getElementById('generate').addEventListener('click', runCampaignBuilder);
</script>
</body>
</html>
