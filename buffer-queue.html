<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vid567 Buffer Queue</title><style>:root{--navy:#14365e;--blue:#245c91;--bg:#f7f9fc;--line:#d8e2ec;--green:#176b45;--text:#172033}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui}.wrap{max-width:1050px;margin:auto;padding:24px}.head{background:var(--navy);color:#fff;padding:28px 0}.head h1{margin:0}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.controls select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.card.done{border-top:5px solid var(--green)}.meta{display:flex;justify-content:space-between;color:#65717e;font-size:.86rem}.post{white-space:pre-wrap;margin:12px 0}.actions{display:flex;gap:8px}.actions button{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}.actions .copy{background:var(--blue);color:#fff;border:0;font-weight:800}.schedule{font-weight:800;color:var(--navy)}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="wrap"><h1>Vid567 Buffer Queue</h1><p>First 10 posts · 3 per day · own GitHub Pages tracking links</p></div></header><main class="wrap"><div class="controls"><label>Channel <select id="channel"><option value="bsky">Bluesky</option><option value="threads">Threads</option></select></label></div><section id="grid" class="grid"></section></main><script>const links={bsky:{dcp:'https://vid567.github.io/apps/go/dcp-bsky/',pp:'https://vid567.github.io/apps/go/pp-bsky/',stamp:'https://vid567.github.io/apps/go/stamp-bsky/',coin:'https://vid567.github.io/apps/go/coin-bsky/'},threads:{dcp:'https://vid567.github.io/apps/go/dcp-threads/',pp:'https://vid567.github.io/apps/go/pp-threads/',stamp:'https://vid567.github.io/apps/go/stamp-threads/',coin:'https://vid567.github.io/apps/go/coin-threads/'}};const items=[{app:'stamp',id:'STAMP-001',when:'Day 1 · 09:00',body:'Inherited a stamp collection and not sure where to start?\n\nStart with an overview. Turn clear collection photos into an editable inventory you can review at your own pace.\n\n🌍 English Browser Beta'},{app:'dcp',id:'DCP-001',when:'Day 1 · 14:00',body:"Most people don't overspend.\nThey just don't know where their money went.\n\nA coffee here.\nA bill over there.\n\nOne clear overview changes everything."},{app:'pp',id:'PP-001',when:'Day 1 · 20:00',body:'I bought eggs yesterday.\n\nGot home. Opened the fridge.\nThere were already 18 eggs.\n\nNot because I forgot. Because I had no overview.'},{app:'coin',id:'COIN-001',when:'Day 2 · 09:00',body:'Inherited a box of coins and not sure what is in it?\n\nStart with an overview. Clear photos can become an editable inventory you can review before deeper research.\n\n🌍 English Browser Beta'},{app:'stamp',id:'STAMP-002',when:'Day 2 · 14:00',body:'A stamp collection is easier to explore when you can see what is actually there.\n\nStart with photos, build an inventory and decide what you want to research next.\n\n🌍 English Browser Beta'},{app:'dcp',id:'DCP-002',when:'Day 2 · 20:00',body:'Money comes.\nMoney goes.\nWhere it disappears... nobody knows.\n\nYour money is not always gone. Sometimes it is simply hidden in dozens of small payments.'},{app:'pp',id:'PP-002',when:'Day 3 · 09:00',body:'I kept buying pasta.\n\nEvery week.\nLast weekend I counted...\n11 unopened packs.\n\nApparently my memory is not inventory.'},{app:'coin',id:'COIN-002',when:'Day 3 · 14:00',body:'You do not need to know every ruler, mint or denomination before you begin.\n\nOrganize the collection first. Research the interesting coins next.\n\n🌍 English Browser Beta'},{app:'stamp',id:'STAMP-003',when:'Day 3 · 20:00',body:'Albums, stock books, envelopes and loose stamps can become one clearer overview.\n\nThe Browser Beta helps you build an editable stamp inventory from collection photos.\n\n🌍 English Browser Beta'},{app:'dcp',id:'DCP-003',when:'Day 4 · 09:00',body:"Count what's spent.\nKnow where it went.\n\nStart with three numbers:\n→ income\n→ expenses\n→ debt\n\nClarity begins there."}];function text(x){const cta=channel.value==='bsky'?'Send me your feedback here on Bluesky.':'DM me with your feedback.';return `${x.body}\n\n${links[channel.value][x.app]}\n\n${cta}`}function render(){const done=JSON.parse(localStorage.getItem('vid567BufferDone')||'{}');grid.innerHTML='';items.forEach(x=>{const key=channel.value+'-'+x.id,e=document.createElement('article');e.className='card '+(done[key]?'done':'');e.innerHTML=`<div class="meta"><b>${x.id}</b><span class="schedule">${x.when}</span></div><div class="post"></div><div class="actions"><button class="copy">Copy</button><button class="mark">${done[key]?'✓ Queued':'Mark queued'}</button></div>`;e.querySelector('.post').textContent=text(x);e.querySelector('.copy').onclick=()=>navigator.clipboard.writeText(text(x));e.querySelector('.mark').onclick=()=>{const d=JSON.parse(localStorage.getItem('vid567BufferDone')||'{}');d[key]=!d[key];localStorage.setItem('vid567BufferDone',JSON.stringify(d));render()};grid.appendChild(e)})}channel.onchange=render;render();</script></body></html>
