name: Build marketing content database

on:
  workflow_dispatch:
  push:
    paths:
      - 'marketing/**'
      - '.github/workflows/build-marketing-content.yml'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build central database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node marketing/build-content-database.mjs
      - name: Validate database
        run: |
          node -e "const d=require('./marketing/content-database.json'); if(d.source_count!==200||d.posts.length!==200) process.exit(1); if(d.posts.some(p=>p.character_count>500)) process.exit(2); if(d.posts.some(p=>!p.multilingual_message)) process.exit(3); const counts=Object.groupBy(d.posts,p=>p.product_key); for(const k of ['dcp','pp','stamp','coin']) if((counts[k]||[]).length!==50) process.exit(4); console.log('PASS: 200 English source posts across 4 products, all <= 500 chars')"
      - name: Commit refreshed database
        run: |
          git add marketing/content-database.json marketing/content-database.csv
          if git diff --cached --quiet; then
            echo 'No content changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh central marketing content database'
          git push
