name: Build marketing content database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build central database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node marketing/build-content-database.mjs
      - name: Validate database
        run: |
          node -e "const d=require('./marketing/content-database.json'); if(d.source_count!==150||d.posts.length!==150) process.exit(1); console.log('PASS: 150 source posts')"
      - name: Commit refreshed database
        run: |
          if git diff --quiet -- marketing/content-database.json marketing/content-database.csv; then
            echo 'No content changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing/content-database.json marketing/content-database.csv
          git commit -m 'Refresh central marketing content database'
          git push
