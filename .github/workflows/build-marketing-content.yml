name: Build marketing content database

on:
  workflow_dispatch:
  push:
    paths:
      - 'marketing/**'
      - '.github/workflows/build-marketing-content.yml'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build central database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node marketing/build-content-database.mjs
      - name: Validate database
        run: |
          node -e "const d=require('./marketing/content-database.json');const q=d.qa;if(d.source_count!==400||d.posts.length!==400)process.exit(1);if(q.by_language.en!==200||q.by_language.nl!==200)process.exit(2);for(const k of ['dcp','pp','stamp','coin'])if(q.by_product[k]!==100)process.exit(3);if(q.over_limit.length||q.missing_ai_notice_nl.length||q.wrong_review_status.length||q.exact_duplicates.length)process.exit(4);console.log('PASS: 400 existing Threads posts; 200 EN + 200 NL; 100/product; <=500; review status valid; no duplicates')"
      - name: Commit refreshed database and QA
        run: |
          git add marketing/content-database.json marketing/content-database.csv marketing/qa-report.json
          if git diff --cached --quiet; then
            echo 'No content changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh central EN NL marketing content database and QA'
          git push
